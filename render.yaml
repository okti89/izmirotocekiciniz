services:
  - type: web
    name: izmirotocekiciniz
    runtime: static
    repo: https://github.com/okti89/izmirotocekiciniz
    branch: main
    buildCommand: test -s dist/index.html && test -s dist/sitemap.xml && test -s build.py
    staticPublishPath: ./dist
    headers:
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=86400"
    routes:
      - type: redirect
        source: '/narli-cekici'
        destination: '/bolgeler/narlidere/narli/'
      - type: redirect
        source: '/narlidere-cekici'
        destination: '/bolgeler/narlidere/'
