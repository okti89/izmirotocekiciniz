# Render static sites allow at most 200 redirect/rewrite rules.
# All 262 canonical content pages are served directly from dist.
services:
  - type: web
    name: izmirotocekiciniz
    runtime: static
    repo: https://github.com/okti89/izmirotocekiciniz
    branch: main
    buildCommand: test -s dist/index.html && test -s dist/sitemap.xml && test -s build.py
    staticPublishPath: ./dist
    headers:
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=86400"
    routes:
      - type: redirect
        source: '/1-sanayi-cekici'
        destination: '/sanayi/1-sanayi-sitesi/'
      - type: redirect
        source: '/16-eylul-cekici'
