services:
  - type: web
    name: izmirotocekiciniz
    runtime: static
    repo: https://github.com/okti89/izmirotocekiciniz
    branch: main
    buildCommand: test -s dist/index.html && test -s dist/sitemap.xml && test -s build.py
    staticPublishPath: ./dist
    headers:
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=86400"
    routes:
      - type: redirect
        source: '/sahilevleri-cekici'
        destination: '/bolgeler/narlidere/sahilevleri/'
      - type: redirect
        source: '/sarnic-cekici'
        destination: '/bolgeler/gaziemir/sarnic/'
      - type: redirect
        source: '/sasal-cekici'
        destination: '/bolgeler/menderes/sasal/'
      - type: redirect
        source: '/seferihisar-cekici'
        destination: '/bolgeler/seferihisar/'
      - type: redirect
        source: '/selcuk-cekici'
        destination: '/bolgeler/selcuk/'
      - type: redirect
        source: '/selway-cekici'
        destination: '/bolgeler/noktalar/selway/'
      - type: redirect
        source: '/semikler-cekici'
        destination: '/bolgeler/karsiyaka/semikler/'
      - type: redirect
        source: '/sifne-cekici'
        destination: '/bolgeler/cesme/sifne/'
      - type: redirect
        source: '/sigacik-cekici'
        destination: '/bolgeler/seferihisar/sigacik/'
      - type: redirect
        source: '/sirince-cekici'
        destination: '/bolgeler/selcuk/sirince/'
