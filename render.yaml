services:
  - type: web
    name: izmirotocekiciniz
    runtime: static
    repo: https://github.com/okti89/izmirotocekiciniz
    branch: main
    buildCommand: test -s dist/index.html && test -s dist/sitemap.xml && test -s build.py
    staticPublishPath: ./dist
    headers:
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=86400"
    routes:
      - type: redirect
        source: '/ozdere-cekici'
        destination: '/bolgeler/menderes/ozdere/'
      - type: redirect
        source: '/ozkanlar-cekici'
        destination: '/bolgeler/bornova/ozkanlar/'
      - type: redirect
        source: '/pasaport-cekici'
        destination: '/bolgeler/konak/pasaport/'
      - type: redirect
        source: '/payamli-cekici'
        destination: '/bolgeler/noktalar/payamli/'
      - type: redirect
        source: '/peker-mahallesi-cekici'
        destination: '/bolgeler/noktalar/peker-mahallesi/'
      - type: redirect
        source: '/pinarbasi-cekici'
        destination: '/bolgeler/bornova/pinarbasi/'
      - type: redirect
        source: '/poligon-cekici'
        destination: '/bolgeler/karabaglar/poligon/'
      - type: redirect
        source: '/sabuncubeli-cekici'
        destination: '/guzergahlar/sabuncubeli-tuneli/'
      - type: redirect
        source: '/sabuncubeli-tuneli-cekici'
        destination: '/guzergahlar/sabuncubeli-tuneli/'
