services:
  - type: web
    name: izmirotocekiciniz
    runtime: static
    repo: https://github.com/okti89/izmirotocekiciniz
    branch: main
    buildCommand: test -s dist/index.html && test -s dist/sitemap.xml && test -s build.py
    staticPublishPath: ./dist
    headers:
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=86400"
    routes:
      - type: redirect
        source: '/narlidere-cekici'
        destination: '/bolgeler/narlidere/'
      - type: redirect
        source: '/nazilli-cekici'
        destination: '/bolgeler/noktalar/nazilli/'
      - type: redirect
        source: '/odemis-cekici'
        destination: '/bolgeler/odemis/'
      - type: redirect
        source: '/oglananasi-cekici'
        destination: '/bolgeler/menderes/oglananasi/'
      - type: redirect
        source: '/onur-mahallesi-cekici'
        destination: '/bolgeler/noktalar/onur-mahallesi/'
      - type: redirect
        source: '/oto-elektrik'
        destination: '/hizmetler/oto-elektrik/'
      - type: redirect
        source: '/oto-kurtarma'
        destination: '/hizmetler/oto-kurtarma/'
      - type: redirect
        source: '/otogar-otoyolu-cekici'
        destination: '/guzergahlar/otogar-otoyolu/'
      - type: redirect
        source: '/ovacik-cekici'
        destination: '/bolgeler/cesme/ovacik/'
      - type: redirect
        source: '/ozbek-cekici'
        destination: '/bolgeler/urla/ozbek/'
